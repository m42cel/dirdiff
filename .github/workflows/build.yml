name: Build binaries

on:
  workflow_call:

jobs:
  build:
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p build dist
          go build -o build/dirdiff ./cmd/dirdiff
          tar -C build -czf dist/dirdiff_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz dirdiff
      - uses: actions/upload-artifact@v7
        with:
          name: dirdiff_${{ matrix.goos }}_${{ matrix.goarch }}
          path: dist/dirdiff_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz
