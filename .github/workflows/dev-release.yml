name: Dev release

on:
  push:
    branches: [master]

jobs:
  build:
    uses: ./.github/workflows/build.yml

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Replace previous dev release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete dev --yes --cleanup-tag || true
      - name: Publish dev release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create dev dist/* \
            --title "dev" \
            --target "${{ github.sha }}" \
            --notes "Automatic build from commit ${{ github.sha }}. Not a stable release — use a tagged version (vX.Y.Z) for anything you depend on; this tag is overwritten on every push to master." \
            --prerelease
